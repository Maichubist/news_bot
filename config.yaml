filters:
  deny_title_regex:
    - '(?i)\b(sponsored|advertorial|partner(ed)? content|paid post|promotion)\b'
    - '(?i)\b(podcast|listen)\b'
    - '(?i)\b(newsletter|subscribe|subscription)\b'
    # "deal/deals" прибрано з title — блокувало trade deal, M&A та інші легітимні новини.
    # "watch/video" прибрано з title — блокувало Apple Watch тощо; відео ріжемо по URL.
    - '(?i)\b(coupon|% off|discount|promo code)\b'
    - '(?i)\b(opinion|editorial|column)\b'
    - '(?i)\b(реклама|партнерський матеріал|промокод|знижк)\b'

  deny_url_regex:
    - '(?i)/video/'
    - '(?i)/podcast'
    - '(?i)/newsletters?'
    - '(?i)/subscribe'
    - '(?i)/deals?/'
    - '(?i)/coupons?'
    - '(?i)\butm_'

  deny_summary_regex:
    - '(?i)\b(sponsored|advertorial|partner(ed)? content|paid post)\b'
    - '(?i)\b(партнерський матеріал|на правах реклами)\b'

posting:
  max_posts_per_run: 10
  only_last_hours: 24
  include_source_name: true
  cluster_wait_minutes: 5
  breaking_sources_threshold: 3

  wrap_rules:
    - key: economy_wrap
      title: "Market Wrap"
      categories:
        - economy
        - business
      min_items: 3
      lookback_hours: 6
      cooldown_minutes: 90
      min_sources: 2
      source_label: "Market Wrap"
      hashtag_slug: economy
      prompt_template_key: market_wrap_prompt

    - key: geopolitics_wrap
      title: "Geopolitics Wrap"
      categories:
        - war
        - politics
      min_items: 3
      lookback_hours: 6
      cooldown_minutes: 120
      min_sources: 2
      source_label: "Geopolitics Wrap"
      hashtag_slug: war
      prompt_template_key: geopolitical_wrap_prompt

    - key: technology_wrap
      title: "Tech Wrap"
      categories:
        - technology
        - science
      min_items: 3
      lookback_hours: 8
      cooldown_minutes: 180
      min_sources: 2
      source_label: "Tech Wrap"
      hashtag_slug: technology
      prompt_template_key: tech_wrap_prompt

images:
  og_fetch: true

# Повний текст статті для LLM: один фетч сторінки дає і текст, і og:image/og:video
articles:
  fetch_full_text: true
  max_chars: 3000

# Медіа до постів: відео (пріоритет) -> фото -> текст
media:
  enable_video: true
  max_image_bytes: 5242880     # 5 MB
  max_video_bytes: 20971520    # 20 MB (Telegram bot ліміт 50 MB, тримаємо запас)

db:
  path: data/news.db
  keep_days: 14

network:
  timeout_sec: 25
  verify: certifi

embeddings:
  window_hours: 24
  threshold: 0.84
  require_good_summary: false

app:
  sleep_between_posts_sec: 1.2
  log_level: INFO

monitor:
  every_seconds: 120
  command_poll_seconds: 2

# Human-in-the-loop: пости перед публікацією йдуть на підтвердження в admin-чат.
# on_timeout: skip — мовчання адміна = пост не виходить; publish — публікуємо автоматично.
# Перемикається без рестарту командою /moderation on|off в адмінці.
moderation:
  enabled: true
  timeout_minutes: 45
  on_timeout: skip

# Engagement-метрики постів. Реакції — через message_reaction updates (бот має бути
# адміном каналу). Views/forwards недоступні через Bot API; опційний MTProto-шлях
# (mtproto_enabled + telethon + env TELEGRAM_API_ID/TELEGRAM_API_HASH/TELEGRAM_MTPROTO_SESSION).
# Без жодних кредів модуль тихо деградує (warning раз на добу).
engagement:
  enabled: true
  poll_hours: 6
  lookback_hours: 72
  max_posts: 50
  mtproto_enabled: false

# Батчеве порівняльне ранжування замість абсолютного порога score.
# enabled: false => старий шлях (editorial.min_post_score) працює без змін.
# При enabled: true items після dedup класифікуються дешевою моделлю (без post_text),
# накопичуються зі статусом candidate, і раз на cycle_minutes ранкер (model)
# одним викликом обирає top-N з урахуванням важливості, свіжості, origin-балансу
# і різноманітності тем. Breaking (≥2 джерел) минає чергу. Програвші за
# max_age_hours ідуть у wrap/digest.
ranking:
  enabled: false
  cycle_minutes: 25
  window_hours: 3
  model: gpt-4o
  max_picks: 2
  max_age_hours: 8

# Інкрементальна кластеризація подій по embeddings (cosine до центроїда) замість
# LLM event_key. enabled: false => event_key-матчинг і wraps по категоріях без змін.
# При enabled: true source_count/new-fact рішення йдуть по cluster_id, а wraps
# будуються по сюжетах: кластер з ≥ wrap.min_items items від ≥ wrap.min_sources
# джерел за wrap.lookback_hours => пост «розвиток сюжету» (хронологія кластера).
clustering:
  enabled: false
  threshold: 0.80
  window_hours: 48
  wrap:
    min_items: 3
    min_sources: 2
    lookback_hours: 6
    cooldown_minutes: 90

translate:
  enabled: false
  model: gpt-4o-mini
  max_chars_summary: 350

analytics:
  enabled: true
  daily_report_enabled: true
  commands_enabled: true
  report_hour_local: 22
  timezone: Europe/Kyiv

text_processing:
  enabled: true
  matching_window_hours: 36
  max_candidates: 150
  max_keywords: 12
  duplicate_combined_threshold: 0.84
  duplicate_semantic_threshold: 0.92
  duplicate_lexical_threshold: 0.46
  same_event_combined_threshold: 0.68
  same_event_semantic_threshold: 0.82
  same_event_lexical_threshold: 0.28

editorial:
  min_post_score: 0.80   # знижено з 0.84: тепер є origin-баланс і кращі вхідні дані

  topic_quota:
    window1_hours: 4
    max_posts_window1: 1
    window2_hours: 12
    max_posts_window2: 2

  topic_saturation:
    lookback_hours: 12
    max_topic_share: 0.40
    min_posts: 5

  delay_non_breaking:
    min_minutes: 10
    max_minutes: 20

  source_weighting:
    high_trust_sources:
      - Reuters
      - Bloomberg
      - Financial Times
      - Associated Press
      - AP
      - BBC
      - Суспільне
      - Українська Правда
      - Укрінформ

  # Баланс Україна/світ. М'яка квота: якщо origin займає > max_origin_share
  # опублікованого за lookback_hours, не-breaking новини цього origin
  # йдуть у wrap/digest. Breaking проходить завжди.
  origin_balance:
    enabled: true
    lookback_hours: 12
    max_origin_share: 0.60
    min_posts: 6
    ua_relevance_boost: 0.10   # бонус до score світових новин за ua_relevance_score
