filters:
  deny_title_regex:
    - '(?i)\b(sponsored|advertorial|partner(ed)? content|paid post|promotion)\b'
    - '(?i)\b(podcast|video|watch|listen)\b'
    - '(?i)\b(newsletter|subscribe|subscription)\b'
    - '(?i)\b(deals?|coupon|sale|% off|discount|promo code)\b'
    - '(?i)\b(opinion|editorial|column)\b'

  deny_url_regex:
    - '(?i)/video'
    - '(?i)/podcast'
    - '(?i)/newsletters?'
    - '(?i)/subscribe'
    - '(?i)/deals?'
    - '(?i)/coupons?'
    - '(?i)\butm_'

  deny_summary_regex:
    - '(?i)\b(sponsored|advertorial|partner(ed)? content|paid post)\b'

posting:
  max_posts_per_run: 10
  only_last_hours: 24
  include_source_name: true
  cluster_wait_minutes: 5
  breaking_sources_threshold: 3

  wrap_rules:
    - key: economy_wrap
      title: "Market Wrap"
      categories:
        - economy
        - business
      min_items: 3
      lookback_hours: 6
      cooldown_minutes: 90
      min_sources: 2
      source_label: "Market Wrap"
      hashtag_slug: economy
      prompt_template_key: market_wrap_prompt

    - key: geopolitics_wrap
      title: "Geopolitics Wrap"
      categories:
        - war
        - politics
      min_items: 3
      lookback_hours: 6
      cooldown_minutes: 120
      min_sources: 2
      source_label: "Geopolitics Wrap"
      hashtag_slug: war
      prompt_template_key: geopolitical_wrap_prompt

    - key: technology_wrap
      title: "Tech Wrap"
      categories:
        - technology
        - science
      min_items: 3
      lookback_hours: 8
      cooldown_minutes: 180
      min_sources: 2
      source_label: "Tech Wrap"
      hashtag_slug: technology
      prompt_template_key: tech_wrap_prompt

